remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

# Site settings
title: Mahendra Singh Jakhar
subtitle: "Platform Engineer | DevOps | SRE"
name: Mahendra Singh Jakhar
description: "Engineering blog on Platform Engineering, DevOps, and SRE."
url: "https://majakhar.github.io"
minimal_mistakes_skin: "dark"

# Author info (shows in sidebar)
author:
  name: "Mahendra Singh Jakhar"
  # avatar: "/assets/images/avatar.jpg"  # Add your photo here
  bio: "Software Engineer • Distributed Systems • LLM Infrastructure"
  location: "Vancouver, BC"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/majakhar"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/mahendra-singh-jakhar"

# Navigation menu (TOP BAR)
header_pages:
  - about.md
  - projects.md

# Or use this for more control:
navigation:
  - title: "About"
    url: /about/
  - title: "Projects"
    url: /projects/
  - title: "Blog"
    url: /

# Footer links
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/majakhar"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/mahendra-singh-jakhar"

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      share: true
      toc: true
      toc_sticky: true
      header:
        overlay_color: "#1a1a2e"
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Reading time, comments, etc.
read_time: true
words_per_minute: 200

# SEO
twitter:
  username: mahendra0939  # Update if you have Twitter
og_image: /assets/images/default-og.png

# Analytics (optional)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-95QC0Y988E"

